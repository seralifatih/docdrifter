name: DocDrifter (dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          src-path: "worker/src/"
          docs-path: "docs-site/"
          repo-description: "DocDrifter, a GitHub bot that flags PRs changing source code without updating docs"
